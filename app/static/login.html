<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔒 StudyLife Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #161b22;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #c9d1d9;
    }

    .card {
      width: 100%;
      max-width: 380px;
      padding: 2.5rem 2rem;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: linear-gradient(135deg, #238636, #1a7f37);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #e6edf3;
    }

    .header p {
      font-size: 0.8rem;
      color: #8b949e;
      margin-top: 0.25rem;
    }

    form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #8b949e;
      display: block;
      margin-bottom: 0.35rem;
    }

    input {
      width: 100%;
      padding: 0.6rem 0.85rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus {
      border-color: #388bfd;
      box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.12);
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.65rem;
      background: #238636;
      border: 1px solid #2ea043;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.25rem;
      transition: background 0.15s, border-color 0.15s;
    }

    button[type="submit"]:hover {
      background: #2ea043;
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      width: 100%;
      padding: 0.6rem 0.85rem;
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.4);
      border-radius: 6px;
      color: #f85149;
      font-size: 0.82rem;
      display: none;
    }

    .error-msg.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">SL</div>
    <div class="header">
      <h1>🔒 StudyLife Orchestrator</h1>
      <p>Sign in to your dashboard</p>
    </div>

    <form id="loginForm">
      <div>
        <label for="username">Username</label>
        <input type="email" id="username" name="username" placeholder="your@email.com" autocomplete="username" required />
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••••••" autocomplete="current-password" required />
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in…';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
          credentials: 'include',
        });

        if (res.ok) {
          window.location.href = '/';
        } else {
          const data = await res.json().catch(() => ({}));
          errorMsg.textContent = data.detail || 'Invalid credentials. Please try again.';
          errorMsg.classList.add('visible');
        }
      } catch (err) {
        errorMsg.textContent = 'Network error. Please try again.';
        errorMsg.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
